<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat LangChain — workflow vs deep agent</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --border:#2a2f3a; --text:#e6e8ee; --muted:#9aa3b2; --accent:#4f8cff; --user:#243049; --ai:#1f2a22; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; padding:.75rem 1rem; border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { font-size:1rem; margin:0 auto 0 0; font-weight:600; }
  label { color:var(--muted); font-size:.85rem; display:flex; gap:.4rem; align-items:center; }
  select, input, button, textarea { font:inherit; color:var(--text); background:#11141a; border:1px solid var(--border); border-radius:8px; padding:.45rem .6rem; }
  button { cursor:pointer; background:var(--accent); border-color:var(--accent); color:#fff; }
  button.secondary { background:transparent; color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  main { max-width: 900px; margin: 0 auto; padding: 1rem; display:flex; flex-direction:column; gap:.75rem; min-height: calc(100vh - 140px); }
  #log { flex:1; display:flex; flex-direction:column; gap:.6rem; }
  .msg { padding:.7rem .9rem; border-radius:12px; white-space:pre-wrap; word-break:break-word; border:1px solid var(--border); }
  .msg.user { background:var(--user); align-self:flex-end; max-width:85%; }
  .msg.ai { background:var(--ai); align-self:flex-start; max-width:95%; }
  .msg .who { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.25rem; }
  .msg.error { border-color:#a33; background:#2a1717; }
  .msg a { color:var(--accent); }
  form { display:flex; gap:.5rem; }
  textarea { flex:1; resize:vertical; min-height:2.6rem; }
  footer { color:var(--muted); font-size:.8rem; text-align:center; padding:.5rem; }
</style>
</head>
<body>
<header>
  <h1>Chat LangChain</h1>
  <label>Agent
    <select id="graph">
      <option value="rag_workflow">rag_workflow (LangGraph workflow)</option>
      <option value="chat_deep_agent">chat_deep_agent (Deep Agent)</option>
    </select>
  </label>
  <label>LangSmith API key
    <input id="apikey" type="password" placeholder="blank for langgraph dev" size="26">
  </label>
  <button id="newthread" class="secondary" type="button">New thread</button>
</header>
<main>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask about LangChain, LangGraph, Deep Agents, or LangSmith…" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>
<footer>Served by this deployment's <code>http.app</code> route. Calls <code>/threads</code> and <code>/threads/{id}/runs/stream</code> on the same origin; each run lands in the deployment's tracing project.</footer>
<script>
(() => {
  const base = window.location.origin;
  const $ = (id) => document.getElementById(id);
  const log = $("log"), form = $("form"), input = $("input"), send = $("send");
  const graphSel = $("graph"), keyInput = $("apikey"), newThreadBtn = $("newthread");

  const state = { threadId: null, busy: false };
  try { keyInput.value = localStorage.getItem("ls_api_key") || ""; } catch (_) {}
  keyInput.addEventListener("change", () => { try { localStorage.setItem("ls_api_key", keyInput.value.trim()); } catch (_) {} });

  const headers = () => {
    const h = { "Content-Type": "application/json" };
    const key = keyInput.value.trim();
    if (key) h["x-api-key"] = key;
    return h;
  };

  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const linkify = (s) => escapeHtml(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

  const addMsg = (who, text, cls) => {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.innerHTML = `<span class="who">${escapeHtml(who)}</span><span class="body">${linkify(text)}</span>`;
    log.appendChild(div);
    div.scrollIntoView({ block: "end" });
    return div;
  };
  const setBody = (div, text) => { div.querySelector(".body").innerHTML = linkify(text); div.scrollIntoView({ block: "end" }); };

  const textOf = (m) => {
    const c = m && m.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.map((b) => (typeof b === "string" ? b : (b && b.type === "text" ? b.text : ""))).join("");
    return "";
  };

  async function newThread() {
    const r = await fetch(`${base}/threads`, { method: "POST", headers: headers(), body: "{}" });
    if (!r.ok) throw new Error(`POST /threads → ${r.status}: ${await r.text()}`);
    state.threadId = (await r.json()).thread_id;
    addMsg("system", `New thread ${state.threadId} on ${graphSel.value}`, "ai");
  }

  function handleEvent(event, data, aiDiv) {
    let payload;
    try { payload = JSON.parse(data); } catch (_) { return; }
    if (event === "values") {
      const msgs = payload.messages || [];
      const last = [...msgs].reverse().find((m) => m.type === "ai" && textOf(m).trim());
      if (last) setBody(aiDiv, textOf(last));
    } else if (event === "error") {
      aiDiv.classList.add("error");
      setBody(aiDiv, `Error: ${payload.message || JSON.stringify(payload)}`);
    }
  }

  async function streamRun(text, aiDiv) {
    const body = {
      assistant_id: graphSel.value,
      input: { messages: [{ role: "user", content: text }] },
      stream_mode: "values",
    };
    const r = await fetch(`${base}/threads/${state.threadId}/runs/stream`, { method: "POST", headers: headers(), body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`POST /runs/stream → ${r.status}: ${await r.text()}`);
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        let event = "message", data = "";
        for (const line of chunk.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (data) handleEvent(event, data, aiDiv);
      }
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || state.busy) return;
    state.busy = true; send.disabled = true; input.value = "";
    addMsg("you", text, "user");
    const aiDiv = addMsg(graphSel.value, "…thinking", "ai");
    try {
      if (!state.threadId) await newThread();
      await streamRun(text, aiDiv);
      if (aiDiv.querySelector(".body").textContent === "…thinking") setBody(aiDiv, "(no assistant message returned)");
    } catch (err) {
      aiDiv.classList.add("error");
      setBody(aiDiv, String(err));
    } finally {
      state.busy = false; send.disabled = false; input.focus();
    }
  });

  graphSel.addEventListener("change", () => { state.threadId = null; addMsg("system", `Switched to ${graphSel.value}; next message starts a new thread.`, "ai"); });
  newThreadBtn.addEventListener("click", () => { state.threadId = null; addMsg("system", "Next message starts a new thread.", "ai"); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
})();
</script>
</body>
</html>
