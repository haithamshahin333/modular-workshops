[project]
name = "modular-workshops"
version = "0.1.0"
description = "Mix-and-match LangChain workshop modules for ~1.5 hour customer workshops"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "deepagents-cli",
    "fastapi>=0.115",
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "ipython>=9.6.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.4.7",
    "langchain-aws>=1.0.0",
    "langchain-community>=0.4",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.0.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-cli[inmem]>=0.4.21",
    "langsmith>=0.12.1",
    "notebook>=7.4.7",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0",
    "tavily-python>=0.7.21",
    "langchain-core>=1.5.3",
]

[tool.setuptools]
packages = ["agents", "agents.chat_langchain", "utils"]

[tool.setuptools.package-data]
"agents.chat_langchain" = ["AGENTS.md", "ui/*.html"]
